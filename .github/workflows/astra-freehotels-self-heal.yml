name: ASTRA FreeHotels Self-Heal Release

on:
  push:
    branches: [main]
    paths-ignore:
      - ".astra-green-release.sha256"
      - ".astra-green-release.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-freehotels-self-heal-main
  cancel-in-progress: false

jobs:
  validate-repair-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund

      - name: Prove self-heal engine
        run: npm run test:self-heal

      - name: Apply deterministic repairs
        run: npm run seo:self-heal

      - name: Re-audit repaired bundle
        run: npm run seo:self-heal:audit

      - name: Refuse stale promotion
        shell: bash
        env:
          ORIGINAL_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          if [ "$CURRENT" != "$ORIGINAL_SHA" ]; then
            echo "ASTRA_FREEHOTELS_BLOCKED: main advanced from $ORIGINAL_SHA to $CURRENT"
            exit 78
          fi

      - name: Commit verified repair when needed
        id: repair
        shell: bash
        run: |
          git config user.name "ASTRA SEO Self-Heal"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- site.b64; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          else
            git add site.b64
            git commit -m "seo(self-heal): repair FreeHotels indexability bundle"
            git push origin HEAD:main
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GREEN content checksum
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.repair.outputs.source_sha }}
        run: |
          set -euo pipefail
          sha256sum site.b64 > .astra-green-release.sha256
          HASH="$(cut -d' ' -f1 .astra-green-release.sha256)"
          node <<'NODE'
          const fs=require("fs");
          const marker={
            schema:"astra-green-release/v1",
            site:"freehotels.info",
            sourceSha:process.env.SOURCE_SHA,
            bundle:"site.b64",
            sha256:fs.readFileSync(".astra-green-release.sha256","utf8").trim().split(/\s+/)[0],
            greenVerified:true,
            controller:"ASTRA_FREEHOTELS_SELF_HEAL",
            verifiedAt:new Date().toISOString()
          };
          fs.writeFileSync(".astra-green-release.json",JSON.stringify(marker,null,2)+"\n");
          NODE

      - name: Publish GREEN token
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          LOCAL="$(git rev-parse HEAD)"
          if [ "$CURRENT" != "$LOCAL" ]; then
            echo "ASTRA_FREEHOTELS_BLOCKED: repository race before GREEN token"
            exit 78
          fi
          git add .astra-green-release.sha256 .astra-green-release.json
          if git diff --cached --quiet; then
            echo "GREEN token already current."
            exit 0
          fi
          git commit -m "release: GREEN FreeHotels self-heal verified"
          git push origin HEAD:main
