name: FreeHotels public health proof
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct Railway and custom domains
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://freehotels-live-production.up.railway.app/"
            "https://freehotels.info/"
            "https://www.freehotels.info/"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            curl -fsSL --max-time 25 -D headers.txt -o body.html -w "HTTP=%{http_code} FINAL=%{url_effective}\n" "$url"
            grep -qi "FreeHotels" body.html
            grep -Ei "^(server|location|via|x-|cf-)" headers.txt || true
          done
          curl -fsSL --max-time 20 https://freehotels-live-production.up.railway.app/health | grep -q '^ok'
          curl -fsSL --max-time 20 https://freehotels.info/robots.txt | grep -qi 'sitemap'
          curl -fsSL --max-time 20 https://freehotels.info/sitemap-index.xml | grep -qi '<sitemapindex'
          echo "HTTP_PROOF_PASS"
